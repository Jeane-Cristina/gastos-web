name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos e gerar o build
        run: npm run build
        env:
          VITE_API_URL: https://gastos-kpca.onrender.com/api

      - name: Rodar os testes
        run: npx vitest run

  # Testes de ponta a ponta no navegador. A API é simulada (cy.intercept), então o job
  # não depende do backend nem do tempo de acordar do servidor no Render.
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build apontando para uma API simulada
        run: npx vite build
        env:
          VITE_API_URL: http://api.test/api

      # Sobe o app, espera responder e roda o Cypress no mesmo passo. O servidor é iniciado
      # aqui (e não pelo `start` da action) para ver o log dele se algo falhar.
      - name: Rodar o Cypress
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "O servidor de preview parou:"; cat preview.log; exit 1; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4173 > /dev/null || { echo "O app não respondeu em 30 s:"; cat preview.log; exit 1; }
          npx cypress run

      - name: Guardar capturas de tela se o teste falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
